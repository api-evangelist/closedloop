note: >-
  ClosedLoop AI publishes NO client SDK for the /v1 REST API. Its documentation shows raw curl
  against api.closedloop.sh and contains no SDK or client-library section. What it does publish on
  npm is two first-party command-line/agent tools under the @closedloop-ai scope. Both predate the
  current API (spec v1.8.0) and neither is referenced from any current documentation page, so they
  are recorded as published-but-undocumented. PyPI has no closedloop package. The distribution the
  provider actually documents -- the closedloop-skills Claude Code plugin -- ships through the
  Anthropic community plugin marketplace, which is not a package registry and has no version
  metadata endpoint; it is recorded below with version: null for that reason.
