composition_pattern:
  style: allOf
  detail: >-
    Each detail schema is `allOf: [<base>, {additional properties}]` -- InsightDetail extends
    Insight, ThemeDetail extends Theme, FeatureDetail extends Feature. A list response and a detail
    response for the same entity are therefore guaranteed field-compatible on the base, which is
    the right shape for a client that caches list rows and hydrates on demand.
