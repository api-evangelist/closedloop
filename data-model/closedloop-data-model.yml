note: >-
  Relationships marked via a $ref are structural (the schema literally embeds the other schema).
  Relationships marked via an *_id field are id references the API documents as round-trippable
  filters. Nothing here is inferred from naming alone: every `via` names a field that exists in the
  published spec.
id_scheme:
  format: uuid
  prefixed: false
  prefixed_note: >-
    No typed id prefixes (no `ins_`, `thm_` style). Ids are bare UUIDs, so an id carries no
    self-describing type -- a caller must track which endpoint produced it.
  immutability: >-
    Insight and theme ids are immutable and are never reassigned or recycled. A removed resource
    404s rather than resolving to something else.
  merge_pointer: >-
    A merged theme resolves via replacement_theme_id, returned on the 410 THEME_RETIRED body and on
    the Theme schema. The pointer is final, never a chain link.
