modelling_notes:
- id: two-kinds-of-feature-id
  detail: >-
    product_feature_id and feature_area_id name two DIFFERENT id kinds and are never
    interchangeable. A product feature is a buildable item from /features; a feature area is the
    subject area an insight is filed under, from /areas. The provider flags this explicitly because
    the field names invite the mistake.
- id: scoped-vs-stored-counts
  detail: >-
    insight_count and unique_customer_count on a Feature are SCOPED when the list is filtered by
    feature_area_id or product_area_id, but FeatureDetail always reports the unscoped figure. The
    same field name can therefore return different numbers from /features and /features/{id}, and
    the spec says so in the property description rather than leaving it to be discovered.
- id: no-deletion-signal
  detail: >-
    No tombstone or soft-delete field exists on any entity, and the incremental export does not emit
    deletions. A warehouse built from this API cannot learn that a record was removed.
