note: 'security.txt, openid-configuration, api-catalog and ai-plugin.json are served by NO ClosedLoop
  AI host. What IS served is the MCP OAuth pair (RFC 8414 authorization-server metadata and RFC 9728 protected-resource
  metadata) on all four API/MCP hosts, plus an A2A agent card on the docs host. app.closedloop.sh answers
  200 with the same SPA HTML shell for EVERY /.well-known/* path probed, including paths no host should
  serve -- it is a catch-all, NOT a document, and is recorded here as a miss so it is never mistaken for
  a served surface.


  MCP-host OAuth discovery added 2026-09-19 (roadmap#321/#337): the harvest visits a provider''s primary
  hosts, and RFC 9728 protected-resource metadata lives on the MCP host, so these documents existed and
  were invisible to the scorer. Fetched live and validated on `resource`/`issuer`; one negative control
  per host.'
