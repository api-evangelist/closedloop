apis:
- name: ClosedLoop AI MCP Server
  description: >-
    Hosted, first-class MCP server over HTTP with OAuth auth (interactive auto-registration or client_credentials
    for M2M). Ships MCP tools (query insights, context, customers, themes, competitors) and a 'prd' prompt/slash
    command. Works with Claude Code, Claude Desktop/web/Cowork, Cursor, LiteLLM, or any MCP-compatible
    client. US endpoint https://mcp.closedloop.sh, EU endpoint https://eu.mcp.closedloop.sh.
  humanURL: https://closedloop.sh/docs/mcp-server/overview
  baseURL: https://mcp.closedloop.sh
  tags:
  - Product Intelligence
  - Customer Feedback
  - Voice of Customer
  - Product Management
  - Agentic AI
  - MCP
  - SaaS analytics
  tags_raw:
  - product intelligence
  - customer feedback
  - voice-of-customer
  - product management
  - agentic AI
  - MCP
  - SaaS analytics
  properties:
  - type: MCPServer
    url: mcp/closedloop-mcp.yml
    description: >-
      Hosted remote MCP over Streamable HTTP with OAuth 2.1. deployment.mode=remote, endpoint https://mcp.closedloop.sh
      (EU: https://eu.mcp.closedloop.sh). Verified by probe 2026-08-30: POST tools/list returns 401 with
      an RFC 9728 WWW-Authenticate challenge. 12 tools transcribed from the provider Tools Reference.
  - type: MCPServer
    url: https://mcp.closedloop.sh
    description: >-
      LIVE MCP, OAuth-gated. NOTE the path -- the endpoint is the HOST ROOT; https://mcp.closedloop.sh/mcp
      returns 404 ROUTE_NOT_FOUND. Verified 2026-08-30.
  - type: MCPServer
    url: https://eu.mcp.closedloop.sh
    description: EU regional MCP endpoint. Verified 2026-08-30, same 401 OAuth challenge.
  - type: ToolCrosswalk
    url: mcp/closedloop-tool-crosswalk.yml
    description: >-
      Binds each of the 12 MCP tools to its backing /v1 operation. 10 of 12 tools bind to REST; 10 of
      20 REST operations have no tool.
  - type: OAuthScopes
    url: scopes/closedloop-scopes.yml
  - type: Documentation
    url: https://closedloop.sh/docs/mcp-server/overview
  - type: Documentation
    url: https://closedloop.sh/docs/mcp-server/tools
  - type: Documentation
    url: https://closedloop.sh/docs/account/mcp-service-clients
